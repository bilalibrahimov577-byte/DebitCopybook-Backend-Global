spring:
  application:
    name: DebitCopybook
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Martın 2-dəki stabil halda 'update' qalsın, amma ehtiyatlı ol
      ddl-auto: update
    show-sql: true # SQL-ləri logda görmək üçün
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # SQL-ləri oxunaqlı (alt-alta) çıxarır
        highlight_sql: true # Terminalda SQL-i rəngli göstərir

# Log səviyyəsini artırırıq ki, binding parametrlərini (məs. ID-ləri) görəsən
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080

google:
  oauth:
    client-id:
      android: ${GOOGLE_OAUTH_CLIENT_ID_ANDROID}
      web: ${GOOGLE_OAUTH_CLIENT_ID_WEB}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 1296000000

admin:
  email: ${ADMIN_EMAIL}


